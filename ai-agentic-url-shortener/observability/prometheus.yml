global:
  scrape_interval: 5s

scrape_configs:
  - job_name: shortener-java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["shortener-service:8080"]
  - job_name: agent-orchestrator-python
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-orchestrator:8000"]
