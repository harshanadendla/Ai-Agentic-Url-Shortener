server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: shortener-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DATABASE_USER:shortener}
    password: ${DATABASE_PASSWORD:shortener}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  lifecycle:
    timeout-per-shutdown-phase: 20s

shortener:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  cache-ttl: ${CACHE_TTL:PT24H}
  create-rate-limit-per-minute: ${CREATE_RATE_LIMIT_PER_MINUTE:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: shortener-service

springdoc:
  swagger-ui:
    path: /docs
