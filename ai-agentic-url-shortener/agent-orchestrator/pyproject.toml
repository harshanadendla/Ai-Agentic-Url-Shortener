[project]
name = "agent-orchestrator"
version = "1.0.0"
description = "Controlled-autonomy SDLC agent orchestrator for the Java URL shortener"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "prometheus-client>=0.20,<1",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
